plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamepadbt.controller'
    compileSdk 35

    defaultConfig {
        applicationId "com.gamepadbt.controller"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// Sin dependencias externas: solo el framework de Android.
